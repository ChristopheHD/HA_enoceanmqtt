name: Release Chart

on:
  pull_request:
    branches: [ "develop" ]
  workflow_run:
    workflows: ["Create and publish a Docker image"]
    types: [completed]

jobs:
  release:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'develop' ||
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'workflow_run' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Chart Dependencies
        run: helm dependency update chart/

      - name: Lint Chart
        run: helm lint chart/

      - name: Resolve Docker image tag
        id: versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_RUN_BRANCH" == "develop" ]]; then
              BASE_VERSION=$(awk '$1 == "version:" {print $2; exit}' chart/Chart.yaml)
              IMAGE_TAG="sha-${WORKFLOW_RUN_SHA:0:7}"
              CHART_VERSION="${BASE_VERSION}-dev.${WORKFLOW_RUN_ID}"
            elif [[ "$WORKFLOW_RUN_BRANCH" == v* ]]; then
              RELEASE_VERSION="${WORKFLOW_RUN_BRANCH#v}"
              IMAGE_TAG="$RELEASE_VERSION"
              CHART_VERSION="$RELEASE_VERSION"
            else
              echo "Unsupported workflow branch/tag: $WORKFLOW_RUN_BRANCH" >&2
              exit 1
            fi
          else
            SOURCE_SHA="${PULL_REQUEST_SHA:-$CURRENT_SHA}"
            IMAGE_TAG="sha-${SOURCE_SHA:0:7}"
            CHART_VERSION="0.0.0-pr.${PULL_REQUEST_NUMBER:-0}.${GITHUB_RUN_ID}"
          fi

          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Chart
        run: >-
          helm package chart/
          --version "${{ steps.versions.outputs.chart_version }}"
          --app-version "${{ steps.versions.outputs.tag }}"
          --destination ./chart-packages

      - name: Push Chart to GHCR
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          CHART_VERSION="${{ steps.versions.outputs.chart_version }}"
          helm push "./chart-packages/ha-enoceanmqtt-${CHART_VERSION}.tgz" oci://ghcr.io/christophehd/helm-charts
